name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez, sem cancelar a que já está no ar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 24 e não 22: o lock é gerado com npm 11 e o npm 10 que vem no Node 22
          # considera incompleto o registro de deps opcionais do sharp.
          node-version: 24
          cache: npm

      - run: npm ci

      # Avisa se a paleta divergiu de Muowl/carmilla sem derrubar o deploy.
      - name: Conferir paleta
        continue-on-error: true
        run: npm run sync:palette -- --check

      - name: Build
        env:
          # Antes do cutover, defina a variável de repositório SITE_URL como
          # https://muowl.github.io. Depois, apague-a para voltar ao padrão.
          SITE_URL: ${{ vars.SITE_URL || 'https://muowl.dev' }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
